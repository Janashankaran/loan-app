<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#4CAF50">
    <title>Statement</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .header h2 {
            margin: 5px;
        }

        .info {
            margin-top: 10px;
        }

        .status {
            font-weight: bold;
            color: green;
        }

        .table {
            margin-top: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .given {
            color: red;
        }

        .received {
            color: green;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .print-btn {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            margin-top: 15px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Loan Statement</h2>
        <p>{{name}}</p>
    </div>

    <div class="info">
        Status: <span class="status">{{status}}</span>
    </div>

    <div class="table">
        {% for t in transactions %}
        <div class="row">
            <div>
                {% if t.type == 'given' %}
                    <span class="given">Given</span>
                {% else %}
                    <span class="received">Received</span>
                {% endif %}
            </div>

            <div>{{t.amount}}</div>

            <div>{{t.date}} {{t.time}}</div>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        Balance: ₹ {{balance}}
    </div>

    <button class="print-btn" onclick="window.print()">🖨 Print / Share</button>

</div>

</body>
</html>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js')
    .then(() => console.log("Service Worker Registered"));
}
</script>
